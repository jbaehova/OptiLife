<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OptiLife</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Cpath d='M10 22V10h12v12H10Zm3-3h6v-6h-6v6Z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/styles.css">
    <script defer src="/static/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand-block">
        <div class="brand">OptiLife</div>
        <div class="muted">courses.csv 기반 시간표 추천</div>
      </div>
      <div class="top-meta">
        <span id="courseCount">-</span>
        <span id="dataSource">-</span>
      </div>
      <div id="apiStatus" class="status">연결 확인</div>
    </header>

    <main class="shell app-workbench">
      <aside class="panel controls" aria-label="조건">
        <form id="conditionForm">
          <div class="section-title">
            <span>조건</span>
            <div class="condition-actions">
              <button class="ghost-button" type="button" id="resetButton">초기화</button>
              <button class="primary-button" type="submit">추천 계산</button>
            </div>
          </div>

          <div class="data-strip" aria-label="데이터 상태">
            <div>
              <span>과목</span>
              <strong id="coursesDatasetCount">-</strong>
            </div>
            <div>
              <span>전공필수</span>
              <strong id="coreDatasetCount">-</strong>
            </div>
            <div>
              <span>카테고리</span>
              <strong id="categoryDatasetCount">-</strong>
            </div>
            <div>
              <span>평가 컬럼</span>
              <strong id="reviewFloorStatus">-</strong>
            </div>
          </div>

          <div class="condition-grid">
            <div class="condition-section">
              <div class="group-label">하드 조건</div>
              <div class="field-grid">
                <label class="field">
                  <span>최소 학점</span>
                  <input id="minCredits" name="min_credits" type="number" min="1" max="30" value="15">
                </label>
                <label class="field">
                  <span>최대 학점</span>
                  <input id="maxCredits" name="max_credits" type="number" min="1" max="30" value="18">
                </label>
                <label class="field">
                  <span>전공필수 최소</span>
                  <input id="coreMinCount" name="core_min_count" type="number" min="0" max="30" value="2">
                </label>
                <label class="field">
                  <span>전공필수 최대</span>
                  <input id="coreMaxCount" name="core_max_count" type="number" min="0" max="30" value="4">
                </label>
                <label class="field">
                  <span>추천 수</span>
                  <input id="limit" name="limit" type="number" min="1" max="10" value="3">
                </label>
              </div>

              <div class="field category-field">
                <span>카테고리</span>
                <div class="segmented-options" id="categoryOptions"></div>
              </div>
            </div>

            <div class="condition-section">
              <div class="group-label">선호 점수</div>
              <div class="preference-grid">
                <div class="field">
                  <span>공강 선호</span>
                  <div class="segmented-options day-options" id="freeDays">
                    <label><input type="checkbox" value="Mon">월</label>
                    <label><input type="checkbox" value="Tue">화</label>
                    <label><input type="checkbox" value="Wed">수</label>
                    <label><input type="checkbox" value="Thu">목</label>
                    <label><input type="checkbox" value="Fri" checked>금</label>
                  </div>
                </div>

                <div class="toggle-group" aria-label="선호 조건">
                  <label class="switch-row">
                    <input id="avoidEarly" type="checkbox" checked>
                    <span>이른 수업 회피</span>
                  </label>
                  <label class="switch-row">
                    <input id="avoidFridayAfternoon" type="checkbox" checked>
                    <span>금요일 오후 회피</span>
                  </label>
                  <label class="switch-row">
                    <input id="balanceDays" type="checkbox" checked>
                    <span>요일 부담 분산</span>
                  </label>
                </div>

                <label class="field">
                  <span>이른 수업 기준</span>
                  <input id="earlyCutoff" name="early_cutoff" type="time" value="10:00">
                </label>
              </div>

              <div class="weight-grid">
                <label class="range-field">
                  <span>평점</span>
                  <input id="ratingWeight" type="range" min="0" max="5" step="0.1" value="1">
                  <strong data-output-for="ratingWeight">1</strong>
                </label>
                <label class="range-field">
                  <span>과제</span>
                  <input id="workloadWeight" type="range" min="0" max="5" step="0.1" value="1.1">
                  <strong data-output-for="workloadWeight">1.1</strong>
                </label>
                <label class="range-field">
                  <span>조모임</span>
                  <input id="teamworkWeight" type="range" min="0" max="5" step="0.1" value="0.8">
                  <strong data-output-for="teamworkWeight">0.8</strong>
                </label>
                <label class="range-field">
                  <span>성적</span>
                  <input id="gradingWeight" type="range" min="0" max="5" step="0.1" value="0.9">
                  <strong data-output-for="gradingWeight">0.9</strong>
                </label>
              </div>
            </div>
          </div>
        </form>
      </aside>

      <div id="resultsArea" class="results-area">
        <section class="workspace" aria-live="polite">
          <div class="workspace-header">
            <div>
              <div class="eyebrow">추천 결과</div>
              <h1 id="resultTitle">시간표를 계산 중입니다</h1>
            </div>
            <div class="metric-row">
              <div>
                <span>학점</span>
                <strong id="selectedCredits">-</strong>
              </div>
              <div>
                <span>전공필수</span>
                <strong id="selectedCoreCount">-</strong>
              </div>
              <div>
                <span>점수</span>
                <strong id="selectedScore">-</strong>
              </div>
            </div>
          </div>

          <div id="recommendationTabs" class="tabs"></div>
          <div id="calendar" class="calendar"></div>
        </section>

        <aside class="panel inspector" aria-label="상세">
          <div class="section-title">
            <span>상세</span>
          </div>
          <div id="summary" class="summary-list"></div>

          <div class="section-title compact">
            <span>진단</span>
          </div>
          <div id="diagnostics" class="diagnostic-list"></div>

          <div class="section-title compact">
            <span>조건 데이터</span>
          </div>
          <pre id="conditionPayload" class="payload">{}</pre>
        </aside>
      </div>
    </main>
  </body>
</html>
