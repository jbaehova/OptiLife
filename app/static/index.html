<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OptiLife</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23167a5a'/%3E%3Cpath d='M9 17l4 4 10-11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/styles.css">
    <script defer src="/static/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand-block">
        <div class="brand">OptiLife</div>
        <div class="muted">조건 기반 시간표 MVP</div>
      </div>
      <div class="flow" aria-label="pipeline">
        <span>원본 리뷰</span>
        <span>AI 라벨</span>
        <span>과목 목록</span>
        <span>추천 결과</span>
      </div>
      <div id="apiStatus" class="status">연결 확인</div>
    </header>

    <main class="shell">
      <section class="panel admin-panel" aria-label="데이터 관리">
        <div class="section-title">
          <span>데이터 관리</span>
          <button class="ghost-button" type="button" id="syncReviewsButton">리뷰 해석 및 동기화</button>
        </div>

        <div class="dataset-grid">
          <div class="dataset-item">
            <span>과목 목록 CSV</span>
            <strong id="coursesDatasetCount">-</strong>
            <small id="coursesDatasetPath">-</small>
          </div>

          <div class="dataset-item">
            <span>원본 리뷰 CSV</span>
            <strong id="rawReviewsDatasetCount">-</strong>
            <small id="rawReviewsDatasetPath">-</small>
          </div>

          <div class="dataset-item">
            <span>라벨 리뷰 CSV</span>
            <strong id="labeledReviewsDatasetCount">-</strong>
            <small id="labeledReviewsDatasetPath">-</small>
          </div>

          <div class="dataset-item">
            <span>리뷰 보강 상태</span>
            <strong id="reviewFloorStatus">-</strong>
            <small id="reviewFloorDetail">-</small>
          </div>
        </div>

        <div id="syncMessage" class="sync-message">동기화 대기</div>
      </section>

      <section class="panel controls" aria-label="조건">
        <form id="conditionForm">
          <div class="section-title">
            <span>조건</span>
            <div class="condition-actions">
              <button class="ghost-button" type="button" id="resetButton">초기화</button>
              <button class="primary-button" type="submit">추천 계산</button>
            </div>
          </div>

          <div class="condition-body">
            <div class="condition-fields">
              <label class="field two-col">
                <span>최소 학점</span>
                <input id="minCredits" name="min_credits" type="number" min="1" max="30" value="15">
              </label>

              <label class="field two-col">
                <span>최대 학점</span>
                <input id="maxCredits" name="max_credits" type="number" min="1" max="30" value="18">
              </label>

              <label class="field two-col">
                <span>추천 수</span>
                <input id="limit" name="limit" type="number" min="1" max="10" value="3">
              </label>

              <label class="field two-col time-field">
                <span>이른 수업 기준</span>
                <input id="earlyCutoff" name="early_cutoff" type="time" value="10:00">
              </label>
            </div>

            <div class="field day-field">
              <span>공강 선호</span>
              <div class="day-options" id="freeDays">
                <label><input type="checkbox" value="Mon">월</label>
                <label><input type="checkbox" value="Tue">화</label>
                <label><input type="checkbox" value="Wed">수</label>
                <label><input type="checkbox" value="Thu">목</label>
                <label><input type="checkbox" value="Fri" checked>금</label>
              </div>
            </div>

            <div class="toggle-group" aria-label="회피 조건">
              <label class="switch-row">
                <input id="avoidEarly" type="checkbox" checked>
                <span>이른 수업 회피</span>
              </label>

              <label class="switch-row">
                <input id="avoidFridayAfternoon" type="checkbox" checked>
                <span>금요일 오후 회피</span>
              </label>

              <label class="switch-row">
                <input id="balanceDays" type="checkbox" checked>
                <span>요일 부담 분산</span>
              </label>
            </div>

            <div class="weight-group">
              <div class="group-label">가중치</div>
              <label class="range-field">
                <span>전공필수</span>
                <input id="coreWeight" type="range" min="0" max="20" step="1" value="8">
                <strong data-output-for="coreWeight">8</strong>
              </label>

              <label class="range-field">
                <span>난이도</span>
                <input id="difficultyWeight" type="range" min="0" max="5" step="0.1" value="1.3">
                <strong data-output-for="difficultyWeight">1.3</strong>
              </label>

              <label class="range-field">
                <span>과제량</span>
                <input id="workloadWeight" type="range" min="0" max="5" step="0.1" value="1.1">
                <strong data-output-for="workloadWeight">1.1</strong>
              </label>
            </div>
          </div>
        </form>
      </section>

      <div id="resultsArea" class="results-area" hidden>
        <section class="workspace" aria-live="polite">
          <div class="workspace-header">
            <div>
              <div class="eyebrow">추천 결과</div>
              <h1 id="resultTitle">시간표를 계산 중입니다</h1>
            </div>
            <div class="metric-row">
              <div>
                <span>과목</span>
                <strong id="courseCount">-</strong>
              </div>
              <div>
                <span>데이터</span>
                <strong id="dataSource">-</strong>
              </div>
            </div>
          </div>

          <div id="recommendationTabs" class="tabs"></div>
          <div id="calendar" class="calendar"></div>
        </section>

        <aside class="panel inspector" aria-label="상세">
          <div class="section-title">
            <span>상세</span>
          </div>
          <div id="summary" class="summary-list"></div>

          <div class="section-title compact">
            <span>조건 데이터</span>
          </div>
          <pre id="conditionPayload" class="payload">{}</pre>
        </aside>
      </div>
    </main>
  </body>
</html>
